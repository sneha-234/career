<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12284c">
<title>Lotus Electronics | Recruitment Assessment</title>
<style>
:root{--ink:#12284c;--ink2:#41506b;--mut:#6b7689;--line:#dfe3ea;--bg:#f3f5f9;--card:#fff;--acc:#d6272e;--acc2:#b31d23;--ok:#11794a;--okbg:#e6f4ec;--warn:#9a5b00;--warnbg:#fff4dc;--badbg:#fdeaea;--blue:#1c4fa1;--bluebg:#e9f0fb}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header .b{flex:1;min-width:0}
header .b b{display:block;font-size:17px;letter-spacing:.2px}
header .b span{display:block;font-size:12px;opacity:.75}
.lang{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
main{max-width:600px;margin:0 auto;padding:16px 14px 60px}
main.wide{max-width:1180px}
.demo{background:var(--warnbg);color:var(--warn);font-size:13px;padding:8px 14px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:14px}
h1{font-size:21px;margin:0 0 4px;line-height:1.25}
h2{font-size:17px;margin:0 0 10px}
p{margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}
.steps{display:flex;gap:6px;margin:0 0 14px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--acc)}
label.f{display:block;margin:0 0 14px;font-weight:600;font-size:14.5px}
label.f small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=email],input[type=password],input[type=search],select,textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:400;min-height:46px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.radios{display:flex;gap:10px;margin-top:6px}
.radios label{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:500;display:flex;gap:8px;align-items:center;cursor:pointer;background:#fff}
.radios input{width:18px;height:18px;accent-color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;padding:13px 18px;min-height:48px;cursor:pointer;width:100%}
.btn:active{background:var(--acc2)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.dark{background:var(--ink)}
.btn.sm{width:auto;min-height:36px;padding:7px 12px;font-size:13.5px;font-weight:600}
.row{display:flex;gap:10px}
.row>*{flex:1}
.msg{border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:14.5px}
.msg.bad{background:var(--badbg);color:#8a1218}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.warn{background:var(--warnbg);color:var(--warn)}
.msg.info{background:var(--bluebg);color:var(--blue)}
ul.rules{margin:0 0 14px;padding-left:20px}
ul.rules li{margin-bottom:7px}
.foot{text-align:center;margin-top:22px}
.foot button{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;cursor:pointer;padding:8px}
/* test */
.notest,.notest *{-webkit-user-select:none;user-select:none}
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tm{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px}
.tm.low{color:var(--acc)}
.tbar .sp{flex:1}
.tbar .cnt{font-size:13.5px;color:var(--ink2)}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--ok);width:100%;transition:width 1s linear}
.prog i.low{background:var(--acc)}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--mut)}
.qh .sp{flex:1}
.tag{background:var(--bluebg);color:var(--blue);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.lt{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lt button{border:0;background:#fff;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.lt button.on{background:var(--ink);color:#fff}
.qt{font-size:17.5px;font-weight:600;line-height:1.45;margin:0 0 14px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px;cursor:pointer;font-size:16px}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2)}
.opt.on{border-color:var(--ink);background:var(--bluebg)}
.opt.on b{background:var(--ink);border-color:var(--ink);color:#fff}
.pal{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.pal button{aspect-ratio:1;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;padding:0}
.pal button.d{background:var(--okbg);border-color:#9fd1b7;color:var(--ok)}
.pal button.c{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,20,40,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:20;overflow:auto}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:14px;padding:20px 18px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
#modal .box.wide{max-width:760px}
/* admin */
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tabs .sp{flex:1}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.filters label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.filters input,.filters select{min-height:40px;padding:7px 10px;margin-top:3px}
@media(min-width:800px){.filters{grid-template-columns:2fr 2fr 1fr 1fr 1fr 1fr auto;align-items:end}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:820px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f7f8fb;font-size:12.5px;color:var(--ink2);white-space:nowrap}
tr.grp td{background:var(--bluebg);font-weight:700;color:var(--blue)}
td.n{white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700}
.pill.g{background:var(--okbg);color:var(--ok)}.pill.y{background:var(--warnbg);color:var(--warn)}.pill.r{background:var(--badbg);color:#8a1218}.pill.x{background:#eef0f4;color:var(--mut)}
a.lk,button.lk{color:var(--blue);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;font-size:inherit}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0 0 14px;font-size:14px}
dl.kv dt{color:var(--mut)}dl.kv dd{margin:0;word-break:break-word}
.sheet{font-size:13.5px;border-top:1px solid var(--line);padding:8px 0}
.sheet .ok{color:var(--ok);font-weight:600}.sheet .no{color:#8a1218;font-weight:600}
.qrow{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.qrow div{flex:1;min-width:0;font-size:14px}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}
.btn.sec .spin{border-color:var(--line);border-top-color:var(--ink)}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.prog i{transition:none}}
</style>
</head>

nd report it","Keep it in your pocket"]},"hi":{"q":"आपको स्टोर के फर्श पर ₹500 का नोट पड़ा मिलता है। आप क्या करेंगे?","o":["वहीं पड़ा रहने देंगे","किसी साथी के साथ बांट लेंगे","स्टोर मैनेजर या कैश काउंटर पर जमा करके सूचना देंगे","अपनी जेब में रख लेंगे"]},"a":2},{"id":"self-05","cat":"self","post":null,"fr":false,"excel":false,"scope":"all","en":{"q":"It is a slow hour and you have finished your tasks. What should you do?","o":["Stand outside and chat","Arrange displays, learn product features or ask the supervisor for work","Use your phone for social media","Leave early without telling anyone"]},"hi":{"q":"स्टोर में भीड़ कम है और आपका काम पूरा हो चुका है। आपको क्या करना चाहिए?","o":["बाहर खड़े होकर गपशप करेंगे","डिस्प्ले ठीक करेंगे, प्रोडक्ट फीचर्स सीखेंगे या सुपरवाइज़र से काम पूछेंगे","फोन पर सोशल मीडिया चलाएंगे","बिना बताए जल्दी निकल जाएंगे"]},"a":1},{"id":"self-06","cat":"self","post":null,"fr":false,"excel":false,"scope":"all","en":{"q":"A colleague asks you to give his friend an extra discount that is not approved. What will you do?","o":["Give it if the colleague shares the benefit","Give it just this once","Refuse politely and follow company policy","Give it, because nobody will know"]},"hi":{"q":"एक साथी आपसे अपने दोस्त को बिना अप्रूवल के एक्स्ट्रा डिस्काउंट देने को कहता है। आप क्या करेंगे?","o":["अगर साथी फायदा बांटे तो दे देंगे","सिर्फ इस एक बार दे देंगे","विनम्रता से मना करेंगे और कंपनी की पॉलिसी का पालन करेंगे","दे देंगे, क्योंकि किसी को पता नहीं चलेगा"]},"a":2},{"id":"self-07","cat":"self","post":null,"fr":false,"excel":false,"scope":"all","en":{"q":"Why is it important to wear a neat uniform and ID card at work?","o":["Only to avoid a fine","It matters only on weekends","It is not important if sales are good","It shows professionalism and builds customer trust"]},"hi":{"q":"काम पर साफ यूनिफॉर्म और ID कार्ड पहनना क्यों ज़रूरी है?","o":["सिर्फ जुर्माने से बचने के लिए","यह सिर्फ वीकेंड पर ज़रूरी है","अगर सेल अच्छी है तो ज़रूरी नहीं","इससे प्रोफेशनल छवि बन const postName = (id, lang) => { const p = POSTS.find(p => p.id === id); return p ? p[lang || 'en'] : id; };

/* ===== Random helpers ===== */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const P = arr => arr[R(0, arr.length - 1)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = R(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');

/* ===== Parametric math engine: 30 retail arithmetic generators =====
   Each returns {e, h, c, w, f} : English text, Hindi text, correct value, wrong values, format
   or {e, h, o:[{e,h}], } with o[0] correct for text options. */
const MATH = [
  // 1 GST added on base price
  () => { const b = R(4, 80) * 500, r = P([5, 18]); return { e: `A product's price before GST is ${inr(b)}. GST is ${r}%. What is the final price for the customer?`, h: `एक प्रोडक्ट की GST से पहले की कीमत ${inr(b)} है। GST ${r}% है। ग्राहक के लिए अंतिम कीमत क्या होगी?`, c: b * (100 + r) / 100, w: [b * r / 100, b * (100 - r) / 100, b + r * 10], f: 'inr' }; },
  // 2 Base price from GST-inclusive MRP
  () => { const b = R(4, 60) * 500, r = P([5, 18]), m = b * (100 + r) / 100; return { e: `The price of a product including ${r}% GST is ${inr(m)}. What is the price before GST?`, h: `एक प्रोडक्ट की ${r}% GST सहित कीमत ${inr(m)} है। GST से पहले की कीमत क्या है?`, c: b, w: [Math.round(m * (100 - r) / 100), m - r * 100, b + 500], f: 'inr' }; },
  // 3 GST amount
  () => { const b = R(4, 80) * 500, r = P([5, 18]); return { e: `How much GST is charged on a taxable value of ${inr(b)} at ${r}%?`, h: `${inr(b)} के टैक्सेबल मूल्य पर ${r}% की दर से कितना GST लगेगा?`, c: b * r / 100, w: [b * r / 200, b * r / 50, b * (r + 2) / 100], f: 'inr' }; },
  // 4 CGST share
  () => { const b = R(4, 80) * 1000; return { e: `An invoice has a taxable value of ${inr(b)} with 18% GST, split equally into CGST and SGST. What is the CGST amount?`, h: `एक इनवॉइस का टैक्सेबल मूल्य ${inr(b)} है और उस पर 18% GST है, जो CGST और SGST में बराबर बंटता है। CGST की रकम क्या है?`, c: b * 9 / 100, w: [b * 18 / 100, b * 6 / 100, b * 45 / 1000], f: 'inr' }; },
  // 5 Discount price
  () => { const m = R(10, 120) * 500, d = P([5, 10, 15, 20, 25, 30]); return { e: `The MRP of a product is ${inr(m)}. The store gives a ${d}% discount. What is the selling price?`, h: `एक प्रोडक्ट का MRP ${inr(m)} है। स्टोर ${d}% डिस्काउंट देता है। बिक्री मूल्य क्या होगा?`, c: m * (100 - d) / 100, w: [m * d / 100, m - d * 100, m * (95 - d) / 100], f: 'inr' }; },
  // 6 Find discount %
  () => { const m = R(10, 100) * 1000, d = P([5, 10, 15, 20, 25, 30, 40]), s = m * (100 - d) / 100; return { e: `A product with MRP ${inr(m)} is sold for ${inr(s)}. What is the discount percentage?`, h: `${inr(m)} MRP का प्रोडक्ट ${inr(s)} में बेचा गया। डिस्काउंट कितने प्रतिशत है?`, c: d, w: [d + 5, 100 - d, d * 2], f: 'pct' }; },
  // 7 Successive discounts
  () => { const m = R(10, 80) * 1000, d1 = P([10, 20]), d2 = P([5, 10]); return { e: `MRP is ${inr(m)}. A ${d1}% festival discount is given, and then a further ${d2}% on the reduced price. What is the final price?`, h: `MRP ${inr(m)} है। पहले ${d1}% फेस्टिवल डिस्काउंट दिया गया, फिर घटी हुई कीमत पर ${d2}% और। अंतिम कीमत क्या है?`, c: m * (100 - d1) * (100 - d2) / 10000, w: [m * (100 - d1 - d2) / 100, m * (100 - d1) / 100, m * (100 - d2) / 100], f: 'inr' }; },
  // 8 No-cost EMI
  () => { const n = P([3, 6, 9, 12]), e = R(8, 60) * 250, dp = R(2, 10) * 1000, p = dp + e * n; return { e: `A customer buys a product for ${inr(p)} on no-cost EMI. Down payment is ${inr(dp)} and the rest is paid in ${n} equal monthly EMIs. What is each EMI?`, h: `ग्राहक ${inr(p)} का प्रोडक्ट नो-कॉस्ट EMI पर खरीदता है। डाउन पेमेंट ${inr(dp)} है और बाकी रकम ${n} बराबर मासिक EMI में देनी है। हर EMI कितनी होगी?`, c: e, w: [Math.round(p / n), Math.round((p - dp) / (n + 1)), e + 250], f: 'inr' }; },

  () => { const L = R(2, 10) * 10000, r = P([12, 15, 18, 24]), n = P([6, 12, 18]); return { e: `A loan of ${inr(L)} is given at ${r}% per year simple interest for ${n} months. What is the total interest?`, h: `${inr(L)} का लोन ${r}% सालाना साधारण ब्याज पर ${n} महीने के लिए दिया गया। कुल ब्याज कितना होगा?`, c: L * r * n / 1200, w: [L * r / 100 * (n === 12 ? 2 : 1), L * r * n / 2400, L * (r + 3) * n / 1200], f: 'inr' }; },

    const opt = (amt, short) => ({ e: `${inr(amt)} ${short ? 'short' : 'excess'}`, h: `${inr(amt)} ${short ? 'कम (Short)' : 'ज़्यादा (Excess)'}` });

  // 13 Note count
  () => { const a = R(5, 40), b = R(3, 25), c = R(5, 30), d = R(2, 20), t = 500 * a + 200 * b + 100 * c + 50 * d; return { e: `The cash drawer has ${a} notes of ₹500, ${b} notes of ₹200, ${c} notes of ₹100 and ${d} notes of ₹50. What is the total cash?`, h: `कैश ड्रॉअर में ₹500 के ${a} नोट, ₹200 के ${b} नोट, ₹100 के ${c} नोट और ₹50 के ${d} नोट हैं। कुल कैश कितना है?`, c: t, w: [t + 500, t - 200, t + 150], f: 'inr' }; },
  // 14 Profit % on cost
  () => { const c = R(4, 40) * 500, p = P([10, 15, 20, 25, 30, 40]), s = c * (100 + p) / 100; return { e: `A product costs the store ${inr(c)} and is sold for ${inr(s)}. What is the profit percentage on cost?`, h: `एक प्रोडक्ट की स्टोर को लागत ${inr(c)} है और वह ${inr(s)} में बेचा गया। लागत पर मुनाफा कितने प्रतिशत है?`, c: p, w: [Math.round(p * 100 / (100 + p)), p + 5, p - 5], f: 'pct' }; },
  // 15 Margin % on selling price
  () => { const s = R(4, 40) * 1000, mp = P([10, 15, 20, 25, 30]), c = s * (100 - mp) / 100; return { e: `A product is bought for ${inr(c)} and sold for ${inr(s)}. What is the margin as a percentage of the selling price?`, h: `एक प्रोडक्ट ${inr(c)} में खरीदा और ${inr(s)} में बेचा गया। बिक्री मूल्य पर मार्जिन कितने प्रतिशत है?`, c: mp, w: [Math.round(mp * 100 / (100 - mp)), mp + 5, mp - 5], f: 'pct' }; },
  // 16 Selling price for markup
  () => { const c = R(4, 60) * 500, m = P([10, 15, 20, 25, 30]); return { e: `A product costs ${inr(c)}. The store wants a ${m}% profit on cost. What should be the selling price?`, h: `एक प्रोडक्ट की लागत ${inr(c)} है। स्टोर लागत पर ${m}% मुनाफा चाहता है। बिक्री मूल्य क्या होना चाहिए?`, c: c * (100 + m) / 100, w: [c * m / 100, c + m * 100, Math.round(c * 100 / (100 - m))], f: 'inr' }; },
  // 17 Closing stock
  () => { const o = R(20, 150), r = R(10, 100), s = R(10, o), v = R(1, 8); return { e: `Opening stock of a model was ${o} units. ${r} units were received, ${s} were sold and ${v} were returned to the vendor. What is the closing stock?`, h: `एक मॉडल का ओपनिंग स्टॉक ${o} यूनिट था। ${r} यूनिट आए, ${s} बिके और ${v} वेंडर को वापस किए गए। क्लोज़िंग स्टॉक कितना है?`, c: o + r - s - v, w: [o + r - s + v, o + r - s, o - s - v + r + 2 * v], f: 'num' }; },
  // 18 Stock shortage value
  () => { const sys = R(40, 200), miss = R(2, 9), cost = R(3, 40) * 100; return { e: `The system shows ${sys} units of an accessory, but physical count is ${sys - miss} units. Each unit costs ${inr(cost)}. What is the value of the shortage?`, h: `सिस्टम में एक एक्सेसरी के ${sys} यूनिट दिख रहे हैं, लेकिन गिनती में ${sys - miss} यूनिट मिले। हर यूनिट की लागत ${inr(cost)} है। कमी का मूल्य कितना है?`, c: miss * cost, w: [(miss + 1) * cost, (miss - 1) * cost, miss * cost + 500], f: 'inr' }; },
  // 19 Cartons to pieces
  () => { const n = R(6, 40), k = P([6, 10, 12, 20, 24]), l = R(1, k - 1); return { e: `The warehouse has ${n} full cartons with ${k} pieces each, plus ${l} loose pieces. How many pieces are there in total?`, h: `वेयरहाउस में ${n} पूरे कार्टन हैं, हर कार्टन में ${k} पीस, और ${l} खुले पीस हैं। कुल कितने पीस हैं?`, c: n * k + l, w: [n * k, n * k - l, (n + 1) * k + l], f: 'num' }; },
  // 20 Target achievement %
  () => { const t = R(4, 40) * 50000, p = P([60, 75, 80, 90, 110, 120, 125]); return { e: `The monthly sales target is ${inr(t)} and actual sales are ${inr(t * p / 100)}. What is the target achievement percentage?`, h: `महीने का सेल्स टारगेट ${inr(t)} है और असल सेल ${inr(t * p / 100)} हुई। टारगेट अचीवमेंट कितने प्रतिशत है?`, c: p, w: [Math.abs(100 - p), p + 10, p - 10], f: 'pct' }; },
  // 21 Incentive above target
  () => { const t = R(4, 20) * 50000, ex = R(1, 10) * 20000, r = P([1, 2, 3, 5]); return { e: `A salesperson's target is ${inr(t)} and actual sales are ${inr(t + ex)}. Incentive is ${r}% of the sales above target. What is the incentive?`, h: `एक सेल्सपर्सन का टारगेट ${inr(t)} है और असल सेल ${inr(t + ex)} है। इंसेंटिव टारगेट से ऊपर की सेल का ${r}% है। इंसेंटिव कितना बनेगा?`, c: ex * r / 100, w: [(t + ex) * r / 100, t * r / 100, ex * r / 200], f: 'inr' }; },
  // 22 Average bill value
  () => { const n = R(8, 60), avg = R(15, 120) * 100; return { e: `A store made total sales of ${inr(n * avg)} from ${n} bills in a day. What is the average bill value?`, h: `एक स्टोर ने एक दिन में ${n} बिलों से कुल ${inr(n * avg)} की सेल की। औसत बिल वैल्यू क्या है?`, c: avg, w: [avg + 100, avg - 100, avg + 500], f: 'inr' }; },
  // 23 Growth %
  () => { const l = R(10, 80) * 10000, g = P([5, 10, 15, 20, 25, 30, 40, 50]), t = l * (100 + g) / 100; return { e: `Sales were ${inr(l)} last month and ${inr(t)} this month. What is the growth percentage?`, h: `पिछले महीने सेल ${inr(l)} थी और इस महीने ${inr(t)} है। ग्रोथ कितने प्रतिशत है?`, c: g, w: [Math.round(g * 100 / (100 + g)), g + 5, g + 10], f: 'pct' }; },
  // 24 Exchange offer
  () => { const p = R(20, 140) * 500, ex = R(2, 12) * 500, cb = R(1, 6) * 500; return { e: `A TV is priced at ${inr(p)}. The customer gets ${inr(ex)} for the old TV in exchange and an instant bank discount of ${inr(cb)}. How much does the customer pay?`, h: `एक TV की कीमत ${inr(p)} है। ग्राहक को पुराने TV के एक्सचेंज में ${inr(ex)} और ${inr(cb)} का इंस्टेंट बैंक डिस्काउंट मिलता है। ग्राहक को कितना देना होगा?`, c: p - ex - cb, w: [p - ex, p - cb, p - ex + cb], f: 'inr' }; },
  // 25 Combo discount
  () => { const a = R(10, 60) * 500, b = R(2, 20) * 500, d = P([5, 10]); return { e: `A customer buys a refrigerator for ${inr(a)} and a mixer for ${inr(b)}. A ${d}% combo discount applies on the total. What is the final bill?`, h: `ग्राहक ${inr(a)} का रेफ्रिजरेटर और ${inr(b)} का मिक्सर खरीदता है। कुल रकम पर ${d}% कॉम्बो डिस्काउंट है। अंतिम बिल कितना होगा?`, c: (a + b) * (100 - d) / 100, w: [a + b, a + b * (100 - d) / 100, (a + b) * d / 100], f: 'inr' }; },
  // 26 Split payment
  () => { const cash = R(2, 20) * 500, upi = R(2, 20) * 500, card = R(2, 40) * 500, b = cash + upi + card; return { e: `A bill of ${inr(b)} is paid with ${inr(cash)} in cash and ${inr(upi)} by UPI. The balance is paid by card. How much is charged to the card?`, h: `${inr(b)} के बिल में ${inr(cash)} कैश और ${inr(upi)} UPI से दिए गए। बाकी रकम कार्ड से दी गई। कार्ड से कितना चार्ज हुआ?`, c: card, w: [b - cash, b - upi, card + 500], f: 'inr' }; },
  // 27 Delivery trips
  () => { const cap = P([8, 10, 12, 15, 20]), m = R(3, 12) * cap + R(1, cap - 1), c = Math.ceil(m / cap); return { e: `A delivery vehicle can carry ${cap} washing machines per trip. How many trips are needed to deliver ${m} washing machines?`, h: `एक डिलीवरी गाड़ी एक ट्रिप में ${cap} वॉशिंग मशीन ले जा सकती है। ${m} वॉशिंग मशीन पहुंचाने के लिए कितनी ट्रिप लगेंगी?`, c, w: [c - 1, c + 1, c + 2], f: 'num' }; },
  // 28 Conversion %
  () => { const w = R(2, 20) * 100, p = P([10, 12, 15, 20, 25, 30, 40]); return { e: `${w} customers walked into the store and ${w * p / 100} of them made a purchase. What is the conversion percentage?`, h: `स्टोर में ${w} ग्राहक आए और उनमें से ${w * p / 100} ने खरीदारी की। कन्वर्ज़न कितने प्रतिशत है?`, c: p, w: [100 - p, p + 5, p * 2], f: 'pct' }; },
  // 29 Extended warranty
  () => { const p = R(10, 100) * 1000, w = P([5, 8, 10]); return { e: `A laptop costs ${inr(p)}. The extended warranty costs ${w}% of the laptop price. What is the total for laptop plus warranty?`, h: `एक लैपटॉप की कीमत ${inr(p)} है। एक्सटेंडेड वारंटी की कीमत लैपटॉप की कीमत का ${w}% है। लैपटॉप और वारंटी का कुल कितना होगा?`, c: p * (100 + w) / 100, w: [p * w / 100, p + w * 100, p * (105 + w) / 100], f: 'inr' }; },
  // 30 Salary deduction for absence
  () => { const s = R(8, 30) * 1500, a = R(2, 5); return { e: `An employee's monthly salary is ${inr(s)} for a 30-day month. The employee was absent without pay for ${a} days. How much will be deducted?`, h: `एक कर्मचारी की मासिक सैलरी ${inr(s)} है (30 दिन का महीना)। कर्मचारी ${a} दिन बिना वेतन के अनुपस्थित रहा। कितनी कटौती होगी?`, c: s / 30 * a, w: [s / 30 * (a + 1), s / 30, s - s / 30 * a], f: 'inr' }; }
];

const FMT = { inr, pct: n => n + '%', num: n => String(n) };

/* Turn a generator result into a 4-option bilingual question (index 0 correct, unshuffled). */
function mathQuestion(gen) {
  const g = gen();
  if (g.o) return { cat: 'math', en: { q: g.e, o: g.o.map(x => x.e) }, hi: { q: g.h, o: g.o.map(x => x.h) }, a: 0 };
  const fmt = FMT[g.f], c = Math.round(g.c), seen = new Set([c]), wrong = [];
  for (const v of g.w) { const x = Math.round(v); if (x > 0 && !seen.has(x) && wrong.length < 3) { seen.add(x); wrong.push(x); } }
  const step = g.f === 'pct' ? 5 : g.f === 'num' ? 1 : c >= 20000 ? 1000 : c >= 2000 ? 100 : c >= 200 ? 50 : 10;
  let k = 1;
  while (wrong.length < 3 && k < 50) {
    for (const x of [c + step * k, c - step * k]) if (x > 0 && !seen.has(x) && wrong.length < 3) { seen.add(x); wrong.push(x); }
    k++;
  }
  const o = [c, ...wrong].map(fmt);
  return { cat: 'math', en: { q: g.e, o }, hi: { q: g.h, o }, a: 0 };
}

/* Shuffle options of a question (keeps EN and HI aligned). */
function shuffleOptions(q) {
  const perm = shuffle([0, 1, 2, 3]);
  return { id: q.id || null, cat: q.cat, en: { q: q.en.q, o: perm.map(i => q.en.o[i]) }, hi: { q: q.hi.q, o: perm.map(i => q.hi.o[i]) }, a: perm.indexOf(q.a) };
}

const MATH_COUNT = 8;
/* Everyday arithmetic only (no GST split, margins or interest): used for freshers. Numbers match the list above. */
const EASY = [1, 5, 6, 8, 10, 12, 13, 17, 19, 20, 22, 24, 25, 26, 27, 28, 29, 30];

/* Posts where a candidate's basic/medium Excel knowledge is checked: at least 4 of the
   10 role questions in an experienced test for these posts are Excel questions. */
const EXCEL_POSTS = ['cashier', 'accountant', 'ea', 'hr'];
const EXCEL_MIN = 4;

/* Build one 25-question test. `remote` = questions from the database (may be empty), bank = built-in bank.
   Experienced: 4 self + 3 lotus + 10 role (incl. >=4 Excel for EXCEL_POSTS) + 8 math.
   Fresher:     4 self + 3 lotus + up to 5 jargon-free role + aptitude to make 10 + 8 everyday math (no Excel). */
function buildTest(post, remote, bank, fresher) {
  const ok = q => q.en && q.hi && q.en.o && q.en.o.length === 4 && q.hi.o && q.hi.o.length === 4;
  const take = (test, n) => {
    let pool = shuffle((remote || []).filter(q => ok(q) && test(q)));
    if (pool.length < n) { const have = new Set(pool.map(q => q.id)); pool = pool.concat(shuffle(bank.filter(q => ok(q) && test(q) && !have.has(q.id)))); }
    return pool.slice(0, n);
  };
  let picked = take(q => q.cat === 'self', 4).concat(take(q => q.cat === 'lotus', 3));
  if (fresher) { const r = take(q => q.cat === 'role' && q.post === post && q.fr, 5); picked = picked.concat(r, take(q => q.cat === 'apt', 10 - r.length)); }
  else if (EXCEL_POSTS.includes(post)) {
    const exq = take(q => q.cat === 'role' && q.post === post && q.excel, EXCEL_MIN);
    const other = take(q => q.cat === 'role' && q.post === post && !q.excel, 10 - exq.length);
    picked = picked.concat(exq, other);
  }
  else picked = picked.concat(take(q => q.cat === 'role' && q.post === post, 10));
  const gens = fresher ? EASY.map(i => MATH[i - 1]) : MATH;
  const maths = shuffle(gens).slice(0, MATH_COUNT).map(mathQuestion);
  return shuffle(picked.concat(maths)).map(shuffleOptions);
}

function scoreTest(questions, answers) {
  const by = {};
  let score = 0;
  questions.forEach((q, i) => {
    by[q.cat] = by[q.cat] || [0, 0];
    by[q.cat][1]++;
    if (answers[i] === q.a) { score++; by[q.cat][0]++; }
  });
  return { score, total: questions.length, by };
}

const CHUNK = 700000, PAGE = 300;
const attId = (m, p) => m + '_' + p;
const newId = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'; let s = ''; for (const b of crypto.getRandomValues(new Uint8Array(20))) s += c[b % c.length]; return s; };
const fmtD = ms => ms ? new Date(ms).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const fmtDT = ms => ms ? new Date(ms).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const mmss = s => s == null ? '' : Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const ms = v => v && v.toMillis ? v.toMillis() : (typeof v === 'number' ? v : null);
const fileB64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => no(new Error('read')); r.readAsDataURL(f); });
const b64Blob = (b64, type) => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: type || 'application/octet-stream' }); };

/* ===== Database layer: Firebase when configured, this device's storage in demo mode ===== */
let FB = null;
async function fb() {
  if (FB) return FB;
  const [A, F] = await Promise.all([import(CDN + 'firebase-app.js'), import(CDN + 'firebase-firestore-lite.js')]);
  const app = A.initializeApp(FIREBASE_CONFIG);
  FB = { app, F, db: F.getFirestore(app) };
  return FB;
}
async function fbAuth() {
  const b = await fb();
  if (!b.A) { b.A = await import(CDN + 'firebase-auth.js'); b.auth = b.A.getAuth(b.app); }
  await b.auth.authStateReady();
  return b;
}
const normCand = (id, d) => Object.assign({}, d, { id, createdAt: ms(d.createdAt), submittedAt: ms(d.submittedAt) });

const DB = {
  async getAttempt(m, p) {
    if (!LIVE) { const a = LS.get('lx_att', {})[attId(m, p)]; return a ? { at: a } : null; }
    const { F, db } = await fb();
    const s = await F.getDoc(F.doc(db, 'attempts', attId(m, p)));
    return s.exists() ? { at: ms(s.data().at) || Date.now() } : null;
  },
  /* Saves CV, profile and the attempt marker. `done` remembers finished steps so a retry never repeats one. */
  async start(c, file, done) {
    let cv = done.cv || null;
    if (!LIVE) {
      if (file && !done.cv) { const b64 = await fileB64(file); cv = done.cv = { name: file.name, type: file.type, size: file.size, chunks: 1 }; if (!LS.set('lx_cv_' + c.id, b64)) cv = done.cv = null; }
      const all = LS.get('lx_cands', {}); all[c.id] = Object.assign({}, c, { cv, status: 'started', createdAt: Date.now() }); LS.set('lx_cands', all);
      const att = LS.get('lx_att', {}); att[attId(c.mobile, c.post)] = Date.now(); LS.set('lx_att', att);
      return;
    }
    const { F, db } = await fb();
    if (file && !done.cv) {
      const b64 = await fileB64(file), n = Math.ceil(b64.length / CHUNK);
      for (let i = done.cvPart || 0; i < n; i++) { await F.setDoc(F.doc(db, 'cvChunks', c.id + '_' + i), { cand: c.id, i, d: b64.slice(i * CHUNK, (i + 1) * CHUNK) }); done.cvPart = i + 1; }
      cv = done.cv = { name: file.name, type: file.type || '', size: file.size, chunks: n };
    }
    if (!done.cand) { await F.setDoc(F.doc(db, 'candidates', c.id), Object.assign({}, c, { cv, status: 'started', createdAt: F.serverTimestamp() })); done.cand = true; }
    if (!done.att) { await F.setDoc(F.doc(db, 'attempts', attId(c.mobile, c.post)), { mobile: c.mobile, post: c.post, cand: c.id, at: F.serverTimestamp() }); done.att = true; }
  },
  async submit(id, res) {
    if (!LIVE) { const all = LS.get('lx_cands', {}); if (all[id]) { Object.assign(all[id], res, { status: 'submitted', submittedAt: Date.now() }); LS.set('lx_cands', all); } return; }
    const { F, db } = await fb();
    await F.updateDoc(F.doc(db, 'candidates', id), Object.assign({}, res, { status: 'submitted', submittedAt: F.serverTimestamp() }));
  },
  async questions(post) {
    if (!LIVE) return (LS.get('lx_q', []) || []).filter(q => q.scope === 'all' || q.scope === post);
    const { F, db } = await fb();
    const s = await F.getDocs(F.query(F.collection(db, 'questions'), F.where('scope', 'in', ['all', post])));
    return s.docs.map(d => Object.assign({ id: d.id }, d.data()));
  },
  /* ----- admin ----- */
  async adminReady() {
    if (!LIVE) return sessionStorage.getItem('lx_admin') === '1';
    const b = await fbAuth(); return !!b.auth.currentUser;
  },
  async adminLogin(email, pw) {
    if (!LIVE) { if (pw !== SETTINGS.demoAdminPassword) throw new Error('Wrong password.'); sessionStorage.setItem('lx_admin', '1'); return; }
    const b = await fbAuth();
    let cred;
    try { cred = await b.A.signInWithEmailAndPassword(b.auth, email, pw); } catch (e) { throw new Error('Wrong email or password.'); }
    const s = await b.F.getDoc(b.F.doc(b.db, 'admins', cred.user.uid));
    if (!s.exists()) { await b.A.signOut(b.auth); throw new Error('This login works, but it is not registered as an admin yet. See Setup Guide, Part 3.'); }
  },
  async adminLogout() { if (!LIVE) { sessionStorage.removeItem('lx_admin'); return; } const b = await fbAuth(); await b.A.signOut(b.auth); },
  async candidates(cursor) {
    if (!LIVE) return { rows: Object.entries(LS.get('lx_cands', {})).map(([id, d]) => normCand(id, d)).sort((a, b) => b.createdAt - a.createdAt), cursor: null };
    const { F, db } = await fbAuth();
    const parts = [F.collection(db, 'candidates'), F.orderBy('createdAt', 'desc')];
    if (cursor) parts.push(F.startAfter(cursor));
    parts.push(F.limit(PAGE));
    const s = await F.getDocs(F.query.apply(null, parts));
    return { rows: s.docs.map(d => normCand(d.id, d.data())), cursor: s.docs.length === PAGE ? s.docs[s.docs.length - 1] : null };
  },
  async resetAttempt(m, p) {
    if (!LIVE) { const a = LS.get('lx_att', {}); delete a[attId(m, p)]; LS.set('lx_att', a); return; }
    const { F, db } = await fbAuth(); await F.deleteDoc(F.doc(db, 'attempts', attId(m, p)));
  },
  async deleteCandidate(c) {
    if (!LIVE) { const all = LS.get('lx_cands', {}); delete all[c.id]; LS.set('lx_cands', all); LS.del('lx_cv_' + c.id); return; }
    const { F, db } = await fbAuth();
    for (let i = 0; i < ((c.cv && c.cv.chunks) || 0); i++) await F.deleteDoc(F.doc(db, 'cvChunks', c.id + '_' + i));
    await F.deleteDoc(F.doc(db, 'candidates', c.id));
  },
  async cv(c) {
    if (!LIVE) return b64Blob(LS.get('lx_cv_' + c.id, ''), c.cv.type);
    const { F, db } = await fbAuth(); let b64 = '';
    for (let i = 0; i < c.cv.chunks; i++) { const s = await F.getDoc(F.doc(db, 'cvChunks', c.id + '_' + i)); if (!s.exists()) throw new Error('CV file is incomplete.'); b64 += s.data().d; }
    return b64Blob(b64, c.cv.type);
  },
  async allQuestions() {
    if (!LIVE) return LS.get('lx_q', []) || [];
    const { F, db } = await fbAuth();
    const s = await F.getDocs(F.collection(db, 'questions'));
    return s.docs.map(d => Object.assign({ id: d.id }, d.data()));
  },
  async saveQuestions(list) {
    const clean = list.map(q => ({ id: q.id || newId(), cat: q.cat, post: q.cat === 'role' ? q.post : null, scope: q.cat === 'role' ? q.post : 'all', fr: q.cat === 'role' && !!q.fr, en: { q: q.en.q, o: q.en.o.slice(0, 4) }, hi: { q: q.hi.q, o: q.hi.o.slice(0, 4) }, a: Number(q.a) || 0 }));
    if (!LIVE) { const cur = LS.get('lx_q', []) || []; for (const q of clean) { const i = cur.findIndex(x => x.id === q.id); if (i >= 0) cur[i] = q; else cur.push(q); } LS.set('lx_q', cur); return; }
    const { F, db } = await fbAuth();
    for (let i = 0; i < clean.length; i += 400) {
      const batch = F.writeBatch(db);
      for (const q of clean.slice(i, i + 400)) { const d = Object.assign({}, q); delete d.id; batch.set(F.doc(db, 'questions', q.id), d); }
      await batch.commit();
    }
  },
  async deleteQuestion(id) {
    if (!LIVE) { LS.set('lx_q', (LS.get('lx_q', []) || []).filter(q => q.id !== id)); return; }
    const { F, db } = await fbAuth(); await F.deleteDoc(F.doc(db, 'questions', id));
  }
};

const saveSess = () => LS.set('lx_sess', sess);

/* ===== Rendering ===== */
function render() {
  const admin = S.view === 'admin' || S.view === 'adminLogin';
  let body = '';
  if (S.view === 'check') body = vCheck();
  else if (S.view === 'profile') body = vProfile();
  else if (S.view === 'ready') body = vReady();
  else if (S.view === 'test') body = vTest();
  else if (S.view === 'submitting') body = `<div class="card"><h2>${t('subm')}</h2><p class="mut">${t('failP').split('.')[0]}.</p></div>`;
  else if (S.view === 'submitFail') body = `<div class="card"><h2>${t('failT')}</h2><div class="msg warn">${t('failP')}</div><button class="btn" data-act="retrySubmit">${t('retry')}</button></div>`;
  else if (S.view === 'done') body = vDone();
  else if (S.view === 'adminLogin') body = vAdminLogin();
  else if (S.view === 'admin') body = vAdmin();
  $('#app').innerHTML =
    `<header><div class="b"><b>Lotus Electronics</b><span>${admin ? 'Recruitment Admin' : t('sub')}</span></div>${admin ? '' : `<button class="lang" data-act="lang">${t('langBtn')}</button>`}</header>` +
    (LIVE ? '' : `<div class="demo">${admin ? T.demo.en : t('demo')}</div>`) +
    `<main class="${S.view === 'admin' ? 'wide' : ''} ${S.view === 'test' ? 'notest' : ''}">${body}</main>`;
  document.documentElement.lang = S.lang;
  if (S.view === 'test') tick();
}
const steps = n => `<div class="steps">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>`;
const errBox = () => S.err ? `<div class="msg bad" role="alert">${esc(S.err)}</div>` : '';
const btn = (label, busy, cls) => `<button class="btn ${cls || ''}" ${busy ? 'disabled' : ''}>${busy ? '<span class="spin"></span>' : ''}${label}</button>`;

function vCheck() {
  const b = S.block;
  return `${steps(1)}<div class="card"><h1>${t('aTitle')}</h1><p class="mut">${t('aSub')}</p></div>
  <form class="card" data-form="check" novalidate>
    ${b ? `<div class="msg warn" role="alert">${esc(t('blocked', { post: postName(b.post, S.lang), d1: fmtD(b.at), d2: fmtD(b.at + SETTINGS.cooldownDays * DAY) }))}</div>` : ''}${errBox()}
    <label class="f">${t('mobile')}<small>${t('mobileH')}</small><input type="tel" name="mobile" inputmode="numeric" maxlength="10" autocomplete="tel-national" value="${esc(S.mobile)}"></label>
    <label class="f">${t('post')}<select name="post"><option value="">${t('choose')}</option>${POSTS.map(p => `<option value="${p.id}" ${S.post === p.id ? 'selected' : ''}>${esc(p[S.lang])}</option>`).join('')}</select></label>
    <div style="margin-bottom:16px;font-weight:600;font-size:14.5px">${t('exp')}<div class="radios" role="radiogroup" style="flex-direction:column">${['same', 'other', 'fresher'].map(x => `<label><input type="radio" name="exp" value="${x}" ${S.exp === x ? 'checked' : ''}>${t(x)}</label>`).join('')}</div></div>
    ${btn(t('check'), S.busy)}
  </form>
  <div class="foot"><button data-act="adminOpen">${t('admin')}</button></div>`;
}

const FIELDS = ['name', 'lastCompany', 'lastDesignation', 'lastSalary', 'incentiveInCtc', 'avgIncentive', 'joinDate', 'pf', 'pfNumber', 'dependents', 'whyJoin', 'whyLeave'];
function vProfile() {
  const f = S.form, v = k => esc(f[k] || ''), fr = S.exp === 'fresher';
  const txt = (k, type, extra) => `<label class="f">${t(k)}<input type="${type || 'text'}" name="${k}" value="${v(k)}" ${extra || ''}></label>`;
  const yn = k => `<div class="f" style="margin-bottom:14px;font-weight:600;font-size:14.5px">${t(k)}<div class="radios" role="radiogroup">${['yes', 'no'].map(x => `<label><input type="radio" name="${k}" value="${x}" ${f[k] === x ? 'checked' : ''}>${t(x)}</label>`).join('')}</div></div>`;
  return `${steps(2)}<form class="card" data-form="profile" novalidate>
    <h1>${t('bTitle')}</h1><p class="mut">${esc(postName(S.post, S.lang))} · ${t('x_' + S.exp)} · ${esc(S.mobile)}<br>${t('bSub')}</p>${errBox()}
    ${txt('name', 'text', 'autocomplete="name" maxlength="80"')}
    ${fr ? `<label class="f">${t('qualification')}<small>${t('qualificationH')}</small><input type="text" name="qualification" value="${v('qualification')}" maxlength="80"></label>
    ${txt('passYear', 'number', 'inputmode="numeric" min="1980" max="2100"')}
    <label class="f">${t('otherExp')}<textarea name="otherExp" maxlength="600">${v('otherExp')}</textarea></label>` : `
    ${txt('lastCompany', 'text', 'maxlength="100"')}
    ${txt('lastDesignation', 'text', 'maxlength="80"')}
    ${txt('lastSalary', 'number', 'inputmode="numeric" min="0"')}
    ${yn('incentiveInCtc')}
    ${f.incentiveInCtc === 'no' ? txt('avgIncentive', 'number', 'inputmode="numeric" min="0"') : ''}`}
    ${txt('joinDate', 'date', `min="${new Date().toISOString().slice(0, 10)}"`)}
    ${fr ? '' : yn('pf') + (f.pf === 'yes' ? txt('pfNumber', 'text', 'maxlength="30"') : '')}
    ${txt('dependents', 'number', 'inputmode="numeric" min="0" max="20"')}
    <label class="f">${t('whyJoin')}<textarea name="whyJoin" maxlength="600">${v('whyJoin')}</textarea></label>
    ${fr ? '' : `<label class="f">${t('whyLeave')}<textarea name="whyLeave" maxlength="600">${v('whyLeave')}</textarea></label>`}
    <label class="f">${t('cv')}<small>${t('cvH', { n: SETTINGS.maxCvMB })}${S.file ? ' · <b>' + esc(S.file.name) + '</b>' : ''}</small><input type="file" name="cv" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="margin-top:6px;width:100%"></label>
    <div class="row"><button type="button" class="btn sec" data-act="toCheck">${t('back')}</button>${btn(t('next'))}</div>
  </form>`;
}

function vReady() {
  return `${steps(3)}<div class="card"><h1>${t('cTitle')}</h1><p class="mut">${esc(S.form.name)} · ${esc(postName(S.post, S.lang))}</p>${errBox()}
    <ul class="rules"><li>${t('r1', { n: SETTINGS.durationMin })}</li><li>${t('r2')}</li><li><b>${t('r3')}</b></li><li>${t('r4', { n: SETTINGS.cooldownDays })}</li><li>${t('r5')}</li></ul>
    ${S.busy ? `<p class="mut">${t('saving')}</p>` : ''}
    <div class="row"><button class="btn sec" data-act="toProfile" ${S.busy ? 'disabled' : ''}>${t('back')}</button><button class="btn" data-act="startTest" ${S.busy ? 'disabled' : ''}>${S.busy ? '<span class="spin"></span>' : ''}${t('start')}</button></div></div>`;
}

function vTest() {
  const i = sess.cur, q = sess.q[i], x = q[S.lang] || q.en, n = sess.q.length, done = sess.ans.filter(a => a != null).length;
  return `<div class="tbar"><span class="tm" id="tm" aria-live="off"></span><span class="sp"></span><span class="cnt">${t('answered', { a: done, b: n })}</span></div>
  <div class="prog"><i id="tbar"></i></div>
  <div class="card"><div class="qh"><span>${t('qOf', { a: i + 1, b: n })}</span><span class="tag">${t('cat_' + q.cat)}</span><span class="sp"></span>
    <span class="lt"><button data-act="setLang" data-l="en" class="${S.lang === 'en' ? 'on' : ''}">EN</button><button data-act="setLang" data-l="hi" class="${S.lang === 'hi' ? 'on' : ''}">हिंदी</button></span></div>
    <p class="qt">${esc(x.q)}</p>
    ${x.o.map((o, k) => `<button class="opt ${sess.ans[i] === k ? 'on' : ''}" data-act="ans" data-k="${k}" aria-pressed="${sess.ans[i] === k}"><b>${'ABCD'[k]}</b><span>${esc(o)}</span></button>`).join('')}
  </div>
  <div class="row" style="margin-bottom:14px"><button class="btn sec" data-act="go" data-i="${i - 1}" ${i === 0 ? 'disabled' : ''}>${t('prev')}</button>
    ${i < n - 1 ? `<button class="btn dark" data-act="go" data-i="${i + 1}">${t('next')}</button>` : `<button class="btn" data-act="askSubmit">${t('submit')}</button>`}</div>
  <div class="card"><div class="pal">${sess.q.map((_, k) => `<button data-act="go" data-i="${k}" class="${sess.ans[k] != null ? 'd' : ''} ${k === i ? 'c' : ''}" aria-label="${k + 1}">${k + 1}</button>`).join('')}</div>
    ${i < n - 1 ? `<button class="btn sec" style="margin-top:14px" data-act="askSubmit">${t('submit')}</button>` : ''}</div>`;
}

function vDone() {
  const r = S.done || {};
  return `<div class="card"><h1>${t('doneT')}</h1>
    ${r.submitReason === 'tab-switch' ? `<div class="msg warn">${t('doneAuto')}</div>` : r.submitReason === 'timeout' ? `<div class="msg info">${t('doneTime')}</div>` : ''}
    ${SETTINGS.showScoreToCandidate && r.total ? `<div class="msg ok"><b>${t('score', { a: r.score, b: r.total })}</b></div>` : ''}
    <p>${t('doneP')}</p></div>`;
}

/* ===== Modal ===== */
function modal(html, wide) { const m = $('#modal'); m.innerHTML = `<div class="box ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`; m.classList.add('on'); const b = $('button', m); if (b) b.focus(); }
function closeModal() { const m = $('#modal'); m.classList.remove('on'); m.innerHTML = ''; }

/* ===== Candidate flow ===== */
async function doCheck(form) {
  const mobile = form.mobile.value.replace(/\D/g, '').replace(/^(91|0)(?=\d{10}$)/, ''), post = form.post.value;
  S.mobile = mobile; S.post = post; S.exp = form.exp.value || ''; S.block = null; S.err = '';
  if (!/^[6-9]\d{9}$/.test(mobile)) S.err = t('eMobile'); else if (!post) S.err = t('ePost'); else if (!S.exp) S.err = t('eExp');
  else if (S.exp === 'fresher' && !SETTINGS.fresherPosts.includes(post)) S.err = t('eFresherPost');
  if (S.err) return render();
  S.busy = true; render();
  try {
    const a = await DB.getAttempt(mobile, post);
    if (a && Date.now() - a.at < SETTINGS.cooldownDays * DAY) S.block = { post, at: a.at };
    else { S.view = 'profile'; S.startDone = {}; }
  } catch (e) { S.err = t('eNet'); }
  S.busy = false; render(); window.scrollTo(0, 0);
}

function doProfile() {
  const f = S.form, fr = S.exp === 'fresher', need = fr ? ['name', 'qualification', 'passYear', 'joinDate', 'dependents', 'whyJoin'] : ['name', 'lastCompany', 'lastDesignation', 'lastSalary', 'incentiveInCtc', 'joinDate', 'pf', 'dependents', 'whyJoin', 'whyLeave'];
  if (!fr && f.incentiveInCtc === 'no') need.splice(5, 0, 'avgIncentive');
  if (!fr && f.pf === 'yes') need.splice(need.indexOf('pf') + 1, 0, 'pfNumber');
  const miss = need.find(k => !String(f[k] == null ? '' : f[k]).trim());
  S.err = miss ? t('eReq', { f: t(miss) }) : '';
  if (!S.err && S.file) {
    if (!/\.(pdf|docx?)$/i.test(S.file.name)) S.err = t('eCvType');
    else if (S.file.size > SETTINGS.maxCvMB * 1048576) S.err = t('eCvSize', { n: SETTINGS.maxCvMB });
  }
  if (!S.err) S.view = 'ready';
  render(); window.scrollTo(0, 0);
  if (S.err && miss) { const el = document.querySelector(`[name="${miss}"]`); if (el) el.focus(); }
}

async function startTest() {
  if (S.busy) return;
  S.busy = true; S.err = ''; render();
  const f = S.form;
  if (!S.candId) S.candId = newId();
  const fr = S.exp === 'fresher', base = { id: S.candId, mobile: S.mobile, post: S.post, fresher: fr, exp: S.exp, name: f.name.trim(), joinDate: f.joinDate, dependents: Number(f.dependents) || 0, whyJoin: f.whyJoin.trim() };
  const cand = fr ? Object.assign(base, { qualification: f.qualification.trim(), passYear: Number(f.passYear) || 0, otherExp: (f.otherExp || '').trim(), whyLeave: '', pf: false }) : Object.assign(base, {
    lastCompany: f.lastCompany.trim(), lastDesignation: f.lastDesignation.trim(),
    lastSalary: Number(f.lastSalary) || 0, incentiveInCtc: f.incentiveInCtc === 'yes', avgIncentive: f.incentiveInCtc === 'no' ? Number(f.avgIncentive) || 0 : null,
    pf: f.pf === 'yes', pfNumber: f.pf === 'yes' ? f.pfNumber.trim() : null, whyLeave: f.whyLeave.trim()
  });
  try {
    let remote = [];
    try { remote = await DB.questions(S.post); } catch (e) { remote = []; }
    await DB.start(cand, S.file, S.startDone);
    sess = { candId: cand.id, post: S.post, startAt: Date.now(), q: buildTest(S.post, remote, BANK, S.exp !== 'same'), ans: [], cur: 0, infr: 0 };
    sess.ans = sess.q.map(() => null);
    saveSess(); S.busy = false; S.view = 'test'; beginTest(); render(); window.scrollTo(0, 0);
  } catch (e) {
    S.busy = false;
    if (e && /permission/i.test(String(e.code || e.message)) && S.startDone.cand && !S.startDone.att) { S.view = 'check'; S.block = { post: S.post, at: Date.now() }; }
    else S.err = t('eNet');
    render();
  }
}

function beginTest() { clearInterval(timer); timer = setInterval(tick, 1000); }
function tick() {
  if (!sess || S.view !== 'test') return;
  const left = Math.max(0, DUR - Math.floor((Date.now() - sess.startAt) / 1000)), tm = $('#tm'), bar = $('#tbar');
  if (tm) { tm.textContent = mmss(left); tm.classList.toggle('low', left <= 120); }
  if (bar) { bar.style.width = (left / DUR * 100) + '%'; bar.classList.toggle('low', left <= 120); }
  if (left <= 0) finish('timeout');
}
function leftScreen() {
  if (!sess || S.view !== 'test' || sess.away) return;
  sess.away = true; sess.infr++; saveSess();
  if (sess.infr >= 2) finish('tab-switch');
  else warn();
}
function warn() {
  modal(`<h2 style="color:#8a1218">${t('wTitle')}</h2><p>${t('wText')}</p><button class="btn" data-act="closeModal">${t('wOk')}</button>`);
}
function cameBack() { if (sess && sess.away) { sess.away = false; saveSess(); } }

async function finish(reason) {
  if (!sess || sess.result) return;
  clearInterval(timer); closeModal();
  const r = scoreTest(sess.q, sess.ans);
  sess.result = {
    score: r.score, total: r.total, by: r.by, timeTakenSec: Math.min(DUR, Math.round((Date.now() - sess.startAt) / 1000)), infractions: sess.infr, submitReason: reason,
    sheet: sess.q.map((q, i) => ({ c: q.cat, q: q.en.q, o: q.en.o, a: q.a, p: sess.ans[i] == null ? null : sess.ans[i] }))
  };
  saveSess(); await trySubmit();
}
async function trySubmit() {
  S.view = 'submitting'; render(); window.scrollTo(0, 0);
  try { await DB.submit(sess.candId, sess.result); S.done = sess.result; sess = null; LS.del('lx_sess'); S.view = 'done'; }
  catch (e) { S.view = 'submitFail'; }
  render();
}

/* ===== Admin ===== */
async function openAdmin() {
  S.view = 'adminLogin'; A.err = ''; render();
  try { if (await DB.adminReady()) { S.view = 'admin'; render(); loadCands(true); } } catch (e) { A.err = 'Could not reach the database. Check your internet connection.'; render(); }
}
function vAdminLogin() {
  return `<form class="card" data-form="adminLogin"><h1>Admin sign in</h1>${A.err ? `<div class="msg bad" role="alert">${esc(A.err)}</div>` : ''}
    ${LIVE ? '<label class="f">Email<input type="email" name="email" autocomplete="username" required></label>' : `<p class="mut">Demo mode password: <b>${esc(SETTINGS.demoAdminPassword)}</b></p>`}
    <label class="f">Password<input type="password" name="pw" autocomplete="current-password" required></label>
    ${btn('Sign in', S.busy)}</form><div class="foot"><button data-act="toCheck">Back to the candidate page</button></div>`;
}
async function loadCands(reset) {
  A.loading = true; if (reset) { A.rows = []; A.cursor = null; } render();
  try { const r = await DB.candidates(reset ? null : A.cursor); A.rows = A.rows.concat(r.rows); A.cursor = r.cursor; A.err = ''; }
  catch (e) { A.err = 'Could not load candidates: ' + (e.message || e); }
  A.loading = false; A.loaded = true; render();
}
const expOf = c => c.exp || (c.fresher ? 'fresher' : 'same');
const EXP = { same: 'Same field', other: 'Other field', fresher: 'Fresher' };
const pct = c => c.total ? Math.round(c.score / c.total * 100) : null;
function filtered() {
  const f = A.f, q = f.q.trim().toLowerCase(), from = f.from ? new Date(f.from + 'T00:00').getTime() : 0, to = f.to ? new Date(f.to + 'T23:59:59').getTime() : Infinity;
  return A.rows.filter(c => {
    const when = c.submittedAt || c.createdAt || 0;
    if (q && !((c.name || '').toLowerCase().includes(q) || (c.mobile || '').includes(q))) return false;
    if (f.post && c.post !== f.post) return false;
    if (f.exp && f.exp !== expOf(c)) return false;
    if (when < from || when > to) return false;
    if (f.min !== '0' && !(c.status === 'submitted' && pct(c) > Number(f.min))) return false;
    return true;
  });
}
const scorePill = c => { if (c.status !== 'submitted') return '<span class="pill x">Not submitted</span>'; const p = pct(c); return `<span class="pill ${p > 80 ? 'g' : p > 50 ? 'y' : 'r'}">${c.score}/${c.total}</span>`; };
function vAdmin() {
  const head = `<div class="tabs"><button class="tab ${A.tab === 'cands' ? 'on' : ''}" data-act="aTab" data-t="cands">Candidates</button><button class="tab ${A.tab === 'qs' ? 'on' : ''}" data-act="aTab" data-t="qs">Questions</button><span class="sp"></span><button class="btn sec sm" data-act="adminLogout">Sign out</button></div>${A.err ? `<div class="msg bad" role="alert">${esc(A.err)}</div>` : ''}`;
  return head + (A.tab === 'cands' ? vCands() : vQs());
}
function vCands() {
  const f = A.f, rows = filtered(), counts = {};
  A.rows.forEach(c => counts[c.mobile] = (counts[c.mobile] || 0) + 1);
  const tr = c => `<tr><td><button class="lk" data-act="cand" data-id="${esc(c.id)}">${esc(c.name)}</button>${expOf(c) !== 'same' ? ` <span class="pill y">${EXP[expOf(c)]}</span>` : ''}</td><td class="n">${esc(c.mobile)}${counts[c.mobile] > 1 ? ` <span class="pill x" title="Total applications from this number">${counts[c.mobile]}×</span>` : ''}</td><td>${esc(postName(c.post))}</td><td class="n">${scorePill(c)}</td><td class="n">${c.status === 'submitted' ? fmtDT(c.submittedAt) : 'Started ' + fmtDT(c.createdAt)}</td><td class="n">${c.status === 'submitted' ? mmss(c.timeTakenSec) : ''}</td><td class="n">${c.fresher ? '-' : c.pf ? 'Yes' : 'No'}</td><td class="n">${c.cv ? `<button class="lk" data-act="cv" data-id="${esc(c.id)}">Download</button>` : ''}</td></tr>`;
  let body = '';
  if (f.group) {
    const g = {}; rows.forEach(c => (g[c.mobile] = g[c.mobile] || []).push(c));
    body = Object.keys(g).sort((a, b) => g[b].length - g[a].length).map(m => `<tr class="grp"><td colspan="8">${esc(m)} · ${esc(g[m][0].name)} · ${g[m].length} application(s)</td></tr>` + g[m].map(tr).join('')).join('');
  } else body = rows.map(tr).join('');
  return `<div class="filters">
    <label>Search name or mobile<input type="search" data-f="q" value="${esc(f.q)}"></label>
    <label>Job post<select data-f="post"><option value="">All posts</option>${POSTS.map(p => `<option value="${p.id}" ${f.post === p.id ? 'selected' : ''}>${esc(p.en)}</option>`).join('')}</select></label>
    <label>Experience<select data-f="exp"><option value="">All</option>${Object.keys(EXP).map(k => `<option value="${k}" ${f.exp === k ? 'selected' : ''}>${EXP[k]}</option>`).join('')}</select></label>
    <label>From<input type="date" data-f="from" value="${esc(f.from)}"></label><label>To<input type="date" data-f="to" value="${esc(f.to)}"></label>
    <label>Minimum score<select data-f="min"><option value="0">Any</option><option value="50" ${f.min === '50' ? 'selected' : ''}>Above 50%</option><option value="80" ${f.min === '80' ? 'selected' : ''}>Above 80%</option></select></label>
    <label style="display:flex;gap:6px;align-items:center;min-height:40px"><input type="checkbox" data-f="group" ${f.group ? 'checked' : ''} style="width:18px;height:18px"> Group by mobile</label></div>
  <div class="tabs"><span class="mut">${rows.length} of ${A.rows.length} shown${A.loading ? ' · loading…' : ''}</span><span class="sp"></span><button class="btn sec sm" data-act="reload">Refresh</button><button class="btn sec sm" data-act="csv">Download Excel (CSV)</button></div>
  <div class="tw"><table><thead><tr><th>Name</th><th>Mobile</th><th>Post applied</th><th>Score</th><th>Submitted</th><th>Time taken</th><th>PF</th><th>CV</th></tr></thead><tbody>${body || `<tr><td colspan="8" class="mut">${A.loaded ? 'No candidates match.' : 'Loading…'}</td></tr>`}</tbody></table></div>
  ${A.cursor ? '<p style="margin-top:12px"><button class="btn sec" data-act="more">Load older candidates</button></p>' : ''}`;
}
function candModal(id) {
  const c = A.rows.find(x => x.id === id); if (!c) return;
  const others = A.rows.filter(x => x.mobile === c.mobile).sort((a, b) => b.createdAt - a.createdAt), by = c.by || {};
  const kv = (k, v) => `<dt>${k}</dt><dd>${esc(v == null || v === '' ? '-' : v)}</dd>`;
  const names = { self: 'Work attitude', lotus: 'Lotus and retail basics', math: 'Calculation', role: 'Job knowledge', apt: 'Aptitude' };
  modal(`<h2>${esc(c.name)}</h2><dl class="kv">
    ${kv('Mobile', c.mobile)}${kv('Post', postName(c.post))}${kv('Experience', EXP[expOf(c)] + (expOf(c) === 'same' ? '' : ' (took the no-jargon test)'))}
    ${c.fresher ? kv('Qualification', c.qualification) + kv('Year of passing', c.passYear) + kv('Other experience', c.otherExp) : kv('Last place worked', c.lastCompany) + kv('Last designation', c.lastDesignation) + kv('Last salary / CTC', inr(c.lastSalary)) + kv('Incentive part of CTC', c.incentiveInCtc ? 'Yes' : 'No, average monthly incentive ' + inr(c.avgIncentive || 0)) + kv('PF', c.pf ? 'Yes, ' + (c.pfNumber || '') : 'No') + kv('Reason for leaving', c.whyLeave)}
    ${kv('Earliest joining', c.joinDate)}${kv('Dependents', c.dependents)}${kv('Why Lotus', c.whyJoin)}
    ${c.status === 'submitted' ? kv('Score', `${c.score}/${c.total} (${pct(c)}%)`) + kv('Sections', Object.keys(names).filter(k => by[k]).map(k => `${names[k]} ${by[k][0]}/${by[k][1]}`).join(', ')) + kv('Time taken', mmss(c.timeTakenSec) + ' min') + kv('Left the screen', (c.infractions || 0) + ' time(s)' + (c.submitReason === 'tab-switch' ? ', auto-submitted' : c.submitReason === 'timeout' ? ', time ran out' : '')) : kv('Status', 'Started ' + fmtDT(c.createdAt) + ', never submitted')}
    </dl>
    <h2>All applications from ${esc(c.mobile)}</h2>
    ${others.map(o => `<div class="sheet">${fmtD(o.createdAt)} · ${esc(postName(o.post))} · ${scorePill(o)}</div>`).join('')}
    ${c.sheet ? `<h2 style="margin-top:14px">Answer sheet</h2>` + c.sheet.map((s, i) => `<div class="sheet"><b>${i + 1}. ${esc(s.q)}</b><br>${s.p == null ? '<span class="no">Not answered</span>' : `<span class="${s.p === s.a ? 'ok' : 'no'}">${s.p === s.a ? 'Correct' : 'Wrong'}: ${esc(s.o[s.p])}</span>`}${s.p !== s.a ? `<br><span class="mut">Right answer: ${esc(s.o[s.a])}</span>` : ''}</div>`).join('') : ''}
    <div class="row" style="margin-top:16px;flex-wrap:wrap"><button class="btn sec sm" data-act="retest" data-id="${esc(c.id)}">Allow re-test now</button><button class="btn sec sm" data-act="delCand" data-id="${esc(c.id)}">Delete record</button><button class="btn dark sm" data-act="closeModal">Close</button></div>`, true);
}
function csv() {
  const cols = ['name', 'mobile', 'post', 'experience', 'qualification', 'passYear', 'otherExperience', 'status', 'score', 'total', 'percent', 'submitted', 'timeTaken', 'leftScreen', 'lastCompany', 'lastDesignation', 'lastSalary', 'incentiveInCtc', 'avgIncentive', 'joinDate', 'pf', 'pfNumber', 'dependents', 'whyJoin', 'whyLeave', 'cv'];
  const q = v => { let s = String(v == null ? '' : v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const lines = filtered().map(c => [c.name, c.mobile, postName(c.post), EXP[expOf(c)], c.qualification, c.passYear, c.otherExp, c.status, c.score, c.total, pct(c), fmtDT(c.submittedAt), mmss(c.timeTakenSec), c.infractions, c.lastCompany, c.lastDesignation, c.lastSalary, c.incentiveInCtc ? 'Yes' : 'No', c.avgIncentive, c.joinDate, c.pf ? 'Yes' : 'No', c.pfNumber, c.dependents, c.whyJoin, c.whyLeave, c.cv ? c.cv.name : ''].map(q).join(','));
  download(new Blob(['﻿' + cols.join(',') + '\n' + lines.join('\n')], { type: 'text/csv' }), 'lotus-candidates-' + new Date().toISOString().slice(0, 10) + '.csv');
}
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }

/* ----- question management ----- */
async function loadQs() { A.qs = null; render(); try { A.qs = await DB.allQuestions(); A.err = ''; } catch (e) { A.qs = []; A.err = 'Could not load questions: ' + (e.message || e); } render(); }
const CATS = { self: 'Self-awareness and discipline', lotus: 'Lotus and retail basics', role: 'Role-specific', apt: 'Fresher aptitude' };
function vQs() {
  if (!A.qs) return '<p class="mut">Loading…</p>';
  const list = A.qs.filter(q => !A.qf || q.scope === A.qf || CATS[A.qf] && q.cat === A.qf);
  const count = k => A.qs.filter(q => q.cat === 'role' ? q.post === k : q.cat === k).length;
  return `<div class="card">${A.qs.length === 0 ? `<div class="msg info">The database has no questions yet, so tests use the ${BANK.length} starter questions built into the app. Copy them into the database to edit them or add your own.</div><button class="btn" data-act="seed">Copy the ${BANK.length} starter questions into the database</button>` :
    `<p class="mut">Each test needs 4 self-awareness, 3 Lotus/retail and 10 role questions. A fresher, or someone whose experience is in another field, gets up to 5 role questions marked "OK for freshers" and the rest from Fresher aptitude. If a group has fewer in the database, the app tops up from its built-in starter questions. The 8 calculation questions are generated fresh for every candidate and are not listed here.</p>
    <div class="filters" style="grid-template-columns:1fr auto auto"><label>Show<select data-qf><option value="">All (${A.qs.length})</option><option value="self" ${A.qf === 'self' ? 'selected' : ''}>${CATS.self} (${count('self')})</option><option value="lotus" ${A.qf === 'lotus' ? 'selected' : ''}>${CATS.lotus} (${count('lotus')})</option><option value="apt" ${A.qf === 'apt' ? 'selected' : ''}>${CATS.apt} (${count('apt')})</option>${POSTS.map(p => `<option value="${p.id}" ${A.qf === p.id ? 'selected' : ''}>${esc(p.en)} (${count(p.id)})</option>`).join('')}</select></label>
    <button class="btn sm" data-act="qNew">Add question</button><label class="btn sec sm" style="cursor:pointer">Import file<input type="file" accept=".json,application/json" data-import hidden></label></div>
    ${list.map(q => `<div class="qrow"><div><b>${esc(q.en.q)}</b><br><span class="mut">${esc(q.hi.q)}</span><br><span class="pill g">${esc(q.en.o[q.a])}</span> <span class="pill x">${esc(q.cat === 'role' ? postName(q.post) : CATS[q.cat])}</span>${q.cat === 'role' && q.fr ? ' <span class="pill y">OK for freshers</span>' : ''}</div><button class="btn sec sm" data-act="qEdit" data-id="${esc(q.id)}">Edit</button><button class="btn sec sm" data-act="qDel" data-id="${esc(q.id)}">Delete</button></div>`).join('') || '<p class="mut">No questions in this group.</p>'}`}</div>`;
}
function qModal(id) {
  const q = id ? A.qs.find(x => x.id === id) : { cat: 'role', post: POSTS.some(p => p.id === A.qf) ? A.qf : 'sales', en: { q: '', o: ['', '', '', ''] }, hi: { q: '', o: ['', '', '', ''] }, a: 0 };
  modal(`<form data-form="q"><h2>${id ? 'Edit question' : 'Add question'}</h2><input type="hidden" name="id" value="${esc(id || '')}">
    <div class="row"><label class="f">Group<select name="cat">${Object.keys(CATS).map(c => `<option value="${c}" ${q.cat === c ? 'selected' : ''}>${CATS[c]}</option>`).join('')}</select></label>
    <label class="f">Post (for role-specific)<select name="post">${POSTS.map(p => `<option value="${p.id}" ${q.post === p.id ? 'selected' : ''}>${esc(p.en)}</option>`).join('')}</select></label></div>
    <label style="display:flex;gap:8px;align-items:center;margin-bottom:14px;font-size:14.5px"><input type="checkbox" name="fr" ${q.fr ? 'checked' : ''} style="width:18px;height:18px"> OK for freshers: a role question with no jargon, answerable without work experience</label>
    <label class="f">Question (English)<textarea name="enq" required>${esc(q.en.q)}</textarea></label>
    <label class="f">Question (Hindi)<textarea name="hiq" required>${esc(q.hi.q)}</textarea></label>
    ${[0, 1, 2, 3].map(i => `<div class="card" style="padding:12px"><label style="display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px"><input type="radio" name="a" value="${i}" ${q.a === i ? 'checked' : ''} style="width:18px;height:18px"> Option ${'ABCD'[i]} is the correct answer</label><input type="text" name="en${i}" placeholder="English" value="${esc(q.en.o[i])}" required><input type="text" name="hi${i}" placeholder="Hindi" value="${esc(q.hi.o[i])}" required></div>`).join('')}
    <div class="row"><button type="button" class="btn sec" data-act="closeModal">Cancel</button><button class="btn">Save</button></div></form>`, true);
}
async function saveQ(form) {
  const g = n => form[n].value.trim(), q = { id: g('id') || null, cat: g('cat'), post: g('post'), fr: form.fr.checked, en: { q: g('enq'), o: [0, 1, 2, 3].map(i => g('en' + i)) }, hi: { q: g('hiq'), o: [0, 1, 2, 3].map(i => g('hi' + i)) }, a: Number(form.a.value) };
  try { await DB.saveQuestions([q]); closeModal(); loadQs(); } catch (e) { alert('Could not save: ' + (e.message || e)); }
}
async function importFile(file) {
  try {
    const data = JSON.parse(await file.text()), list = (Array.isArray(data) ? data : data.questions || []).filter(q => q && CATS[q.cat] && q.en && q.hi && Array.isArray(q.en.o) && q.en.o.length === 4 && Array.isArray(q.hi.o) && q.hi.o.length === 4 && (q.cat !== 'role' || POSTS.some(p => p.id === q.post)));
    if (!list.length) return alert('No valid questions found in this file.');
    if (!confirm(`Import ${list.length} question(s)? Questions with the same ID will be replaced.`)) return;
    await DB.saveQuestions(list); loadQs();
  } catch (e) { alert('Could not import: ' + (e.message || e)); }
}

/* ===== Events ===== */
const ACT = {
  lang() { S.lang = S.lang === 'en' ? 'hi' : 'en'; LS.set('lx_lang', S.lang); render(); },
  setLang(el) { S.lang = el.dataset.l; LS.set('lx_lang', S.lang); render(); },
  toCheck() { S.view = 'check'; S.err = ''; history.replaceState(null, '', location.pathname); render(); },
  toProfile() { S.view = 'profile'; S.err = ''; render(); },
  startTest,
  ans(el) { sess.ans[sess.cur] = Number(el.dataset.k); saveSess(); render(); },
  go(el) { const i = Number(el.dataset.i); if (i >= 0 && i < sess.q.length) { sess.cur = i; saveSess(); render(); window.scrollTo(0, 0); } },
  askSubmit() { const left = sess.ans.filter(a => a == null).length; modal(`<h2>${t('cfTitle')}</h2><p>${left ? t('cfLeft', { n: left }) : t('cfAll')}</p><div class="row"><button class="btn sec" data-act="closeModal">${t('cfNo')}</button><button class="btn" data-act="doSubmit">${t('cfYes')}</button></div>`); },
  doSubmit() { finish('submitted'); },
  retrySubmit() { trySubmit(); },
  closeModal,
  adminOpen() { openAdmin(); },
  async adminLogout() { await DB.adminLogout(); A.loaded = false; A.rows = []; A.qs = null; ACT.toCheck(); },
  aTab(el) { A.tab = el.dataset.t; A.err = ''; render(); if (A.tab === 'qs' && !A.qs) loadQs(); },
  reload() { loadCands(true); }, more() { loadCands(false); }, csv,
  cand(el) { candModal(el.dataset.id); },
  async cv(el) { const c = A.rows.find(x => x.id === el.dataset.id); el.textContent = 'Preparing…'; try { download(await DB.cv(c), c.cv.name || 'cv'); el.textContent = 'Download'; } catch (e) { el.textContent = 'Failed, retry'; } },
  async retest(el) { const c = A.rows.find(x => x.id === el.dataset.id); if (!confirm(`Allow ${c.name} to take the ${postName(c.post)} test again right away?`)) return; try { await DB.resetAttempt(c.mobile, c.post); alert('Done. This candidate can take the test again now.'); } catch (e) { alert('Could not do that: ' + (e.message || e)); } },
  async delCand(el) { const c = A.rows.find(x => x.id === el.dataset.id); if (!confirm(`Permanently delete the record and CV of ${c.name}? This cannot be undone.`)) return; try { await DB.deleteCandidate(c); A.rows = A.rows.filter(x => x.id !== c.id); closeModal(); render(); } catch (e) { alert('Could not delete: ' + (e.message || e)); } },
  async seed(el) { el.disabled = true; el.textContent = 'Copying…'; try { await DB.saveQuestions(BANK); } catch (e) { alert('Could not copy: ' + (e.message || e)); } loadQs(); },
  qNew() { qModal(null); }, qEdit(el) { qModal(el.dataset.id); },
  async qDel(el) { if (!confirm('Delete this question?')) return; try { await DB.deleteQuestion(el.dataset.id); loadQs(); } catch (e) { alert('Could not delete: ' + (e.message || e)); } }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el); } });
document.addEventListener('submit', async e => {
  const f = e.target, k = f.dataset.form; if (!k) return; e.preventDefault();
  if (k === 'check') doCheck(f);
  else if (k === 'profile') doProfile();
  else if (k === 'q') saveQ(f);
  else if (k === 'adminLogin') { S.busy = true; A.err = ''; const email = f.email ? f.email.value.trim() : '', pw = f.pw.value; render(); try { await DB.adminLogin(email, pw); S.busy = false; S.view = 'admin'; render(); loadCands(true); } catch (err) { S.busy = false; A.err = err.message || 'Could not sign in.'; render(); } }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.closest('[data-form="check"]') && el.name) S[el.name] = el.value;
  else if (el.closest('[data-form="profile"]') && el.name && el.type !== 'file' && el.type !== 'radio') S.form[el.name] = el.value;
  else if (el.dataset.f === 'q') { A.f.q = el.value; const pos = el.selectionStart; render(); const n = $('[data-f="q"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.closest('[data-form="profile"]')) {
    if (el.type === 'radio') { S.form[el.name] = el.value; render(); const r = document.querySelector(`[name="${el.name}"][value="${el.value}"]`); if (r) r.focus(); }
    else if (el.type === 'file') { S.file = el.files[0] || null; }
  } else if (el.dataset.f && el.dataset.f !== 'q') { A.f[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; render(); }
  else if ('qf' in el.dataset) { A.qf = el.value; render(); }
  else if ('import' in el.dataset && el.files[0]) importFile(el.files[0]);
});
document.addEventListener('visibilitychange', () => document.hidden ? leftScreen() : cameBack());
window.addEventListener('blur', leftScreen);
window.addEventListener('focus', cameBack);
window.addEventListener('beforeunload', e => { if (sess && S.view === 'test') { e.preventDefault(); e.returnValue = ''; } });
for (const ev of ['copy', 'cut', 'contextmenu']) document.addEventListener(ev, e => { if (S.view === 'test') e.preventDefault(); });

/* ===== Start ===== */
(function init() {
  sess = LS.get('lx_sess', null);
  if (sess && sess.q && sess.q.length) {
    if (sess.result) { trySubmit(); return; }
    if (Date.now() - sess.startAt >= DUR * 1000) { render(); finish('timeout'); return; }
    /* Reopening or refreshing the page counts as leaving the test once (unless that exit was already counted). */
    if (!sess.away) sess.infr++;
    sess.away = false; saveSess();
    if (sess.infr >= 2) { render(); finish('tab-switch'); return; }
    S.view = 'test'; beginTest(); render(); warn(); return;
  }
  sess = null;
  if (/[?&]admin=(true|1)/.test(location.search)) { openAdmin(); return; }
  render();
})();

</script>
</body>
</html>
